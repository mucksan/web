<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>4096 Game</title>
<style>
  body {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    background-color: #faf8ef;
    margin: 0;
    padding: 20px 10px;
    color: #776e65;
  }
  
  /* ヘッダー周りのレイアウト */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 90vw;
    max-width: 400px;
    margin-bottom: 15px;
  }
  h1 { font-size: clamp(30px, 8vw, 40px); margin: 0; }
  
  .score-container {
    display: flex;
    gap: 10px;
  }
  .score-box {
    background-color: #bbada0;
    color: #eee4da;
    padding: 5px 15px;
    border-radius: 5px;
    text-align: center;
    font-size: 12px;
    font-weight: bold;
    min-width: 50px;
  }
  .score-box span {
    display: block;
    color: white;
    font-size: 18px;
    margin-top: 2px;
  }

  p.instruction { margin: 0 0 15px 0; font-size: 14px; font-weight: bold; text-align: center; }
  
  #game-board {
    background-color: #bbada0;
    border-radius: 10px;
    width: 90vw;
    max-width: 400px;
    height: 90vw;
    max-height: 400px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 2vw;
    padding: 2vw;
    box-sizing: border-box;
    touch-action: none;
  }

  @media (min-width: 420px) {
    #game-board { gap: 10px; padding: 10px; }
  }

    background-color: #cdc1b4;
    border-radius: 5px;
    display: flex;
    justify-content: center;
